<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Tools Explorer — Canvas</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0f13; }
      .root { position: fixed; inset: 0; overflow: hidden;
        background: radial-gradient(1200px 800px at 10% -10%, #1a2a4a 0%, rgba(26,42,74,0) 60%),
                   radial-gradient(1000px 700px at 110% 10%, #1b4d3e 0%, rgba(27,77,62,0) 55%),
                   linear-gradient(180deg, #0a0f15 0%, #0b0f13 100%); }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .search-input { position: absolute; opacity: 0.01; border: 0; outline: none; background: transparent; color: transparent; caret-color: #a8c7ff; pointer-events: none; }
    </style>
  </head>
  <body>
    <div class="root">
      <canvas id="stage"></canvas>
      <input id="searchInput" class="search-input" type="text" inputmode="search" autocomplete="off" spellcheck="false" />
    </div>
    <!-- SCRIPT_START -->
    <script>
      ;(() => {
        const canvas = document.getElementById('stage')
        const ctx = canvas.getContext('2d')
        let DPR = Math.max(1, Math.min(window.devicePixelRatio || 1, 2))
        function size() {
          const w = innerWidth, h = innerHeight
          DPR = Math.max(1, Math.min(window.devicePixelRatio || 1, 2))
          canvas.width = Math.floor(w * DPR)
          canvas.height = Math.floor(h * DPR)
          canvas.style.width = w + 'px'
          canvas.style.height = h + 'px'
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0)
        }
        function render() {
          size()
          const W = canvas.clientWidth, H = canvas.clientHeight
          ctx.clearRect(0,0,W,H)
          // Placeholder header
          ctx.fillStyle = 'rgba(255,255,255,0.9)'
          ctx.font = '800 24px Inter, system-ui, sans-serif'
          ctx.fillText('AI Tools Explorer', 20, 42)
          ctx.font = '500 13px Inter, system-ui, sans-serif'
          ctx.fillStyle = '#9bb0c5'
          ctx.fillText('Loading UI…', 20, 66)
        }
        addEventListener('resize', render)
        render()
      })()
    </script>
    <!-- SCRIPT_END -->
  </body>
  </html>
